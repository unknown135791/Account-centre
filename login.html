<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Centre | Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #050505;
            --bg-card: rgba(15, 15, 15, 0.7);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        /* Animated Mesh Background */
        .mesh-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .mesh-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            background: #2e1065;
            top: -10%;
            left: -10%;
            animation-duration: 25s;
        }

        .blob-2 {
            background: #1e1b4b;
            bottom: -10%;
            right: -10%;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .blob-3 {
            background: #0f172a;
            top: 40%;
            left: 30%;
            animation-duration: 20s;
            animation-delay: -10s;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 50px) scale(1.1); }
            66% { transform: translate(-50px, 100px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .container {
            background: var(--bg-card);
            width: 100%;
            max-width: 480px;
            border-radius: 32px;
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 48px 40px;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7); }
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .form-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 52px;
            font-size: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        input:focus + i {
            color: var(--primary);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-eye {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .toggle-eye:hover {
            color: var(--primary);
        }

        button[type="submit"], #verifyOtpBtn {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        button[type="submit"]:hover, #verifyOtpBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        }

        button[type="submit"]:active, #verifyOtpBtn:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer-links {
            margin-top: 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .footer-links a:hover {
            color: #818cf8;
            letter-spacing: 0.2px;
        }

        .signup-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        #errorMsg {
            padding: 14px;
            border-radius: 14px;
            margin-top: 24px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            text-align: center;
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* OTP Section styling */
        #otpSection {
            animation: fadeIn 0.5s ease;
        }

        #loginOtp {
            text-align: center;
            letter-spacing: 12px;
            font-size: 28px;
            font-weight: 800;
            padding-left: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="mesh-container">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <div class="container">
        <div class="logo-area">
            <div class="logo-icon">
                <i data-lucide="shield-check" style="width: 32px; height: 32px;"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Securely access your Account Centre</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <i data-lucide="mail"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            
            <div class="form-group">
                <i data-lucide="lock"></i>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <div class="toggle-eye" id="toggleEye">
                        <i data-lucide="eye" style="width: 20px;"></i>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <span>Login</span>
                <i data-lucide="arrow-right" style="width: 18px;"></i>
            </button>

            <div class="footer-links">
                <a href="forgot.html" class="forgot-link">Forgot password?</a>
                <div class="signup-text">
                    Don’t have an account? <a href="signup.html">Create one</a>
                </div>
            </div>
        </form>

        <div id="otpSection" style="display:none; text-align: center;">
            <p style="font-size: 15px; color: var(--text-main); font-weight: 600; margin-bottom: 24px;">
                Verification Required
            </p>
            <div class="form-group">
                <input type="text" id="loginOtp" placeholder="000000" maxlength="6">
            </div>
            <button type="button" id="verifyOtpBtn">
                Verify & Continue
            </button>
            <div class="footer-links" style="margin-top: 24px;">
                <a href="#" id="resendOtpBtn">Resend verification code</a>
            </div>
        </div>

        <div id="errorMsg"></div>
    </div>

    <script>
        const BASE_URL = "https://accountcentre.onrender.com";
        const form = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");
        const passwordInput = document.getElementById("password");
        const toggleEye = document.getElementById("toggleEye");

        // Initialize Lucide Icons
        lucide.createIcons();

        // 🔥 CHECK FOR REDIRECT MESSAGES
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("msg") === "revoked") {
            errorMsg.style.background = "rgba(239, 68, 68, 0.1)";
            errorMsg.style.color = "var(--danger)";
            errorMsg.style.border = "1px solid rgba(239, 68, 68, 0.2)";
            errorMsg.textContent = "You are logged out from this device";
            errorMsg.style.display = "block";
        }

        /* 👁 Toggle password */
        toggleEye.addEventListener("click", () => {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleEye.innerHTML = '<i data-lucide="eye-off" style="width: 20px;"></i>';
            } else {
                passwordInput.type = "password";
                toggleEye.innerHTML = '<i data-lucide="eye" style="width: 20px;"></i>';
            }
            lucide.createIcons();
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.style.display = "none";

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;
            const submitBtn = document.getElementById("submitBtn");

            const originalBtnContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Logging in...</span>';

            try {
                const res = await fetch(`${BASE_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const contentType = res.headers.get("content-type") || "";
                let data = {};

                if (contentType.includes("application/json")) {
                    data = await res.json();
                } else {
                    const text = await res.text();
                    data = { msg: text || "Login failed" };
                }

                if (!res.ok) {
                    if (res.status === 429) {
                        showError(data.msg || "Too many login attempts. Please try again later.", "var(--danger)");
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnContent;
                        return;
                    }

                    if (data.msg === "Verify email first") {
                        form.style.display = "none";
                        document.getElementById("otpSection").style.display = "block";
                        showError("Provide your OTP from the email to verify.", "var(--primary)");
                        return;
                    }

                    showError(data.msg || "Login failed", "var(--danger)");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnContent;
                    return;
                }

                showError("Login successful! Redirecting...", "var(--success)");
                localStorage.setItem("token", data.token);

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (err) {
                console.error(err);
                showError("Server error. Please try again later.", "var(--danger)");
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
            }
        });

        function showError(msg, color) {
            errorMsg.style.background = color === "var(--danger)" ? "rgba(239, 68, 68, 0.1)" : 
                                        color === "var(--success)" ? "rgba(16, 185, 129, 0.1)" : "rgba(79, 70, 229, 0.1)";
            errorMsg.style.color = color;
            errorMsg.style.border = `1px solid ${color}`;
            errorMsg.textContent = msg;
            errorMsg.style.display = "block";
        }

        /* OTP LOGIC */
        const verifyOtpBtn = document.getElementById("verifyOtpBtn");
        const resendOtpBtn = document.getElementById("resendOtpBtn");

        resendOtpBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            resendOtpBtn.textContent = "Sending...";
            
            try {
                const res = await fetch(`${BASE_URL}/resend-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                if (res.ok) {
                    showError("A new code was sent to your email!", "var(--success)");
                } else {
                    showError("Failed to resend code.", "var(--danger)");
                }
            } catch {
                showError("Network error.", "var(--danger)");
            }
            resendOtpBtn.textContent = "Resend verification code";
        });

        verifyOtpBtn.addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim();
            const otp = document.getElementById("loginOtp").value.trim();

            if (!otp) return showError("Please enter the 6-digit code", "var(--danger)");

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = "Verifying...";

            try {
                const res = await fetch(`${BASE_URL}/verify-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp })
                });
                const data = await res.json();

                if (!res.ok) {
                    showError(data.msg || "Invalid code", "var(--danger)");
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = "Verify & Continue";
                    return;
                }

                showError("Account verified! You can now login.", "var(--success)");
                setTimeout(() => {
                    document.getElementById("otpSection").style.display = "none";
                    form.style.display = "block";
                    document.getElementById("password").value = "";
                    const submitBtn = document.getElementById("submitBtn");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Login</span><i data-lucide="arrow-right" style="width: 18px;"></i>';
                    lucide.createIcons();
                    errorMsg.style.display = "none";
                }, 2000);

            } catch (err) {
                showError("Verification error.", "var(--danger)");
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = "Verify & Continue";
            }
        });
    </script>
</body>
</html>
